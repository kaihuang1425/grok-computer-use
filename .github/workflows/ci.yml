name: CI

on:
  push:
  pull_request:

jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Upgrade pip
        run: python -m pip install --upgrade pip
      - name: Install core development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Validate dependencies
        run: python -m pip check
      - name: Test
        run: python -m pytest -q
      - name: Compile
        run: python -m compileall -q src tests

  windows-adapter-import:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Upgrade pip
        run: python -m pip install --upgrade pip
      - name: Install Windows extras
        run: python -m pip install -e ".[windows,dev]"
      - name: Validate dependencies
        run: python -m pip check
      - name: Import Windows adapter
        run: python -c "from grok_cua.adapters.windows import WindowsAdapter; print('windows adapter import ok')"
